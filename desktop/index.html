<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>HWP Workbench</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div class="drag-band"></div>
  <header class="island">
    <span class="seal"><img src="assets/logo.svg" alt=""></span>
    <span id="filename" class="doc">HWP Workbench</span>
    <span id="format" class="chip fmt" hidden></span>
    <span id="dirty" class="chip edits" hidden></span>
    <span class="sep"></span>
    <button id="open" class="btn" data-label="open"></button>
    <button id="save" class="save" disabled><span data-label="saveCopy"></span><kbd>⌘S</kbd></button>
  </header>
  <button id="language" class="language btn" data-title="language"></button>
  <section id="empty" class="welcome">
    <div class="center">
      <div id="dropSheet" class="drop">
        <span class="corner"></span>
        <img class="watermark" src="assets/logo.svg" alt="">
        <div class="formats"><span>HWP</span><span>HWPX</span></div>
        <div class="ghost-lines"><i></i><i></i><i></i></div>
      </div>
      <div class="ctas">
        <button id="emptyOpen" class="btn ink lg"><span data-label="open"></span><kbd>⌘O</kbd></button>
        <button id="demo" class="btn line lg" data-label="sample"></button>
      </div>
    </div>
    <div class="recent"><span class="lbl" data-label="recent"></span><div id="recentItems" class="row"></div></div>
  </section>
  <div id="workspace" hidden>
    <nav class="rail">
      <div class="tools">
        <button id="pagesToggle" class="icon-btn on" data-title="pages" aria-pressed="true">▤</button>
        <button id="outlineToggle" class="icon-btn" data-title="outline" aria-pressed="false">☷</button>
      </div>
      <div id="thumbnails" class="rail-items"></div>
      <div id="outlineItems" class="rail-items" hidden></div>
    </nav>
    <main id="canvas" class="canvas" tabindex="-1" data-title="pages">
      <div id="pages" class="pages"></div>
      <div id="slipHost"></div>
    </main>
    <aside class="panel">
      <div class="tabs" role="tablist">
        <button id="changesTab" class="tab on" role="tab" aria-selected="true" aria-controls="changesPanel"><span data-label="changes"></span><span id="changeCount" class="n">0</span></button>
        <button id="agentTab" class="tab" role="tab" aria-selected="false" aria-controls="agentPanel" data-label="agent"></button>
        <button id="checksTab" class="tab" role="tab" aria-selected="false" aria-controls="checksPanel" data-label="checks"></button>
      </div>
      <section id="changesPanel" class="panel-content" role="tabpanel" aria-labelledby="changesTab">
        <div class="section-label"><span id="stagedCount"></span><button id="review" class="btn ghost" data-label="reviewAll" disabled></button></div>
        <div id="changes"></div>
      </section>
      <section id="agentPanel" class="panel-content" role="tabpanel" aria-labelledby="agentTab" hidden><div class="section-label" data-label="agentPending"></div></section>
      <section id="checksPanel" class="panel-content" role="tabpanel" aria-labelledby="checksTab" hidden><div id="warnings"></div><div class="section-label" data-label="fontSubstitutions"></div><div id="fontSubstitutions"></div></section>
      <div class="foot"><span class="tag off" data-label="layoutUnverified"></span><span id="structureChip" class="tag part" data-label="structure" hidden></span></div>
    </aside>
    <div class="capsule">
      <button id="zoomOut" class="icon-btn" data-title="zoomOut">−</button>
      <button id="zoomValue" class="val" data-title="fitWidth">100%</button>
      <button id="zoomIn" class="icon-btn" data-title="zoomIn">+</button>
      <span class="sep"></span><span id="pageCounter" class="val">1 / 1</span>
      <span class="sep"></span><span class="note" data-label="preview"></span>
    </div>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <dialog id="reviewDialog">
    <header><strong data-label="reviewAll"></strong><button id="closeReview" class="btn ghost" data-title="close">×</button></header>
    <div id="reviewChanges"></div>
    <div id="reviewWarnings"></div>
    <label class="ack"><input id="acknowledge" type="checkbox"><span data-label="ack"></span></label>
    <footer><button id="cancelReview" class="btn ghost" data-label="cancel"></button><button id="confirmSave" class="btn seal" data-label="saveCopy" disabled></button></footer>
  </dialog>
  <script type="module" src="renderer.js"></script>
</body>
</html>
