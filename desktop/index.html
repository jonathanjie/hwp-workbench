<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>HWP Workbench</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div class="drag-band"></div>
  <header class="island">
    <span class="seal"><img src="assets/logo.svg" alt=""></span>
    <span id="filename" class="doc">HWP Workbench</span>
    <span id="format" class="chip fmt" hidden></span>
    <button id="dirty" class="chip edits" hidden></button>
    <button id="agentChip" class="chip agent" hidden></button>
    <button id="paletteButton" class="cmd" data-title="commands"><span>⌘</span><span>K</span></button>
    <button id="save" class="save" hidden disabled><span data-label="save"></span><kbd>⌘S</kbd></button>
  </header>
  <section id="empty" class="welcome">
    <div class="center">
      <div id="dropSheet" class="drop">
        <span class="corner"></span>
        <img class="watermark" src="assets/logo.svg" alt="">
        <div class="formats"><span>HWP</span><span>HWPX</span></div>
        <div class="ghost-lines"><i></i><i></i><i></i></div>
      </div>
      <div class="ctas">
        <button id="emptyOpen" class="btn ink lg"><span data-label="open"></span><kbd>⌘O</kbd></button>
        <button id="demo" class="btn line lg" data-label="sample"></button>
      </div>
    </div>
    <div id="welcomeAgents" class="welcome-agents"></div>
    <div id="recentRow" class="recent" hidden><span class="lbl" data-label="recent"></span><div id="recentItems" class="row"></div></div>
  </section>
  <div id="workspace" hidden>
    <nav class="rail">
      <div class="tools">
        <button id="pagesToggle" class="icon-btn on" data-title="pages" aria-pressed="true">▤</button>
        <button id="outlineToggle" class="icon-btn" data-title="outline" aria-pressed="false">☷</button>
      </div>
      <div id="thumbnails" class="rail-items"></div>
      <div id="outlineItems" class="rail-items" hidden></div>
    </nav>
    <main id="canvas" class="canvas" tabindex="-1" data-title="pages">
      <div id="pages" class="pages"></div>
      <div id="slipHost"></div>
    </main>
    <section id="findBar" class="find-bar" role="search" hidden>
      <div class="find-row"><input id="findQuery" data-title="find" autocomplete="off"><span id="findCount" class="mono" aria-live="polite">0 / 0</span><button id="findPrevious" class="icon-btn" data-title="previousMatch">↑</button><button id="findNext" class="icon-btn" data-title="nextMatch">↓</button><button id="findCase" class="icon-btn mono" data-title="matchCase" aria-pressed="false">Aa</button><button id="findReplaceToggle" class="icon-btn" data-title="replace" aria-expanded="false" aria-controls="replaceRow">⇄</button><button id="findClose" class="icon-btn" data-title="close">×</button></div>
      <div id="replaceRow" class="find-row" hidden><input id="replaceQuery" data-title="replacement" autocomplete="off"><button id="replaceOne" class="btn ghost" data-label="replaceOne"></button><button id="replaceAll" class="btn seal" data-label="replaceAll"></button></div>
      <button id="skippedButton" class="btn ghost" popovertarget="skippedPopover" hidden></button><div id="skippedPopover" class="skipped-popover" popover></div>
    </section>
    <aside id="panel" class="panel" hidden>
      <div class="tabs" role="tablist">
        <button id="changesTab" class="tab on" role="tab" aria-selected="true" aria-controls="changesPanel"><span data-label="changes"></span><span id="changeCount" class="n">0</span></button>
        <button id="agentTab" class="tab" role="tab" aria-selected="false" aria-controls="agentPanel" data-label="agent"></button>
        <button id="checksTab" class="tab" role="tab" aria-selected="false" aria-controls="checksPanel" data-label="checks"></button>
      </div>
      <section id="changesPanel" class="panel-content" role="tabpanel" aria-labelledby="changesTab">
        <div class="section-label"><span id="stagedCount"></span><button id="review" class="btn ghost" data-label="reviewAll" disabled></button></div>
        <div id="changes"></div>
      </section>
      <section id="agentPanel" class="panel-content" role="tabpanel" aria-labelledby="agentTab" hidden><label class="agent-link"><span data-label="agentLink"></span><input id="agentLinkSwitch" type="checkbox" role="switch"></label><div id="agentInbox"></div><div id="panelAgents"></div></section>
      <section id="checksPanel" class="panel-content" role="tabpanel" aria-labelledby="checksTab" hidden><div id="checkTags" class="check-tags"></div><details id="warningDetails"><summary data-label="warningDetails"></summary><div id="warnings"></div></details><div class="section-label" data-label="fontSubstitutions"></div><div id="fontSubstitutions"></div><div class="font-note" data-label="fontInstall"></div></section>
      <div class="foot"><span class="tag off" data-label="layoutUnverified"></span><span id="structureChip" class="tag part" data-label="structure" hidden></span></div>
    </aside>
    <div class="capsule">
      <button id="zoomOut" class="icon-btn" data-title="zoomOut">−</button>
      <button id="zoomValue" class="val" data-title="fitWidth">100%</button>
      <button id="zoomIn" class="icon-btn" data-title="zoomIn">+</button>
      <span class="sep"></span><span id="pageCounter" class="val">1 / 1</span>
      <span class="sep"></span><span id="chordPending" class="val" aria-live="polite"></span><span id="previewStatus" class="note" data-label="preview"></span>
    </div>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <dialog id="reviewDialog" class="sheet review-sheet" data-aria="reviewAll">
    <header><div><strong data-label="reviewAll"></strong><div id="reviewSummary" class="review-summary"></div></div><button id="closeReview" class="btn ghost" data-title="close">×</button></header>
    <div id="reviewChanges" tabindex="0" autofocus data-aria="changes"></div>
    <div class="review-bottom"><details><summary data-label="warningDetails"></summary><div id="reviewWarnings"></div></details>
    <label class="ack"><input id="acknowledge" type="checkbox"><span data-label="ack"></span></label>
    <footer><button id="cancelReview" class="btn ghost" data-label="cancel"></button><button id="confirmSave" class="btn seal" data-label="saveCopy" disabled></button></footer></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="palette" class="palette" data-aria="commands">
    <div class="top"><span class="seal"><img src="assets/logo.svg" alt=""></span><input id="paletteQuery" class="q" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="paletteResults"><div class="scope"></div></div>
    <div id="paletteResults" class="results" role="listbox"></div>
    <div class="foot"><span><kbd>↑↓</kbd><span data-label="navigate"></span></span><span><kbd>↵</kbd><span data-label="run"></span></span><span><kbd>tab</kbd><span data-label="scope"></span></span><span class="palette-note" data-label="preview"></span></div>
  </dialog>
  <dialog id="shortcutsDialog" class="sheet" data-aria="shortcuts"><header><strong data-label="shortcuts"></strong><button id="closeShortcuts" class="btn ghost" data-title="close">×</button></header>
    <div id="keyScheme" class="segmented" role="radiogroup" data-aria="keyScheme">
      <button type="button" role="radio" data-scheme="windows" aria-checked="true" tabindex="0" data-label="schemeWindowsChoice"></button>
      <button type="button" role="radio" data-scheme="mac" aria-checked="false" tabindex="-1" data-label="schemeMacChoice"></button>
    </div>
    <div id="shortcutItems"></div></dialog>
  <dialog id="symbolDialog" class="sheet symbol-picker"></dialog>
  <dialog id="formatDialog" class="sheet format-card"></dialog>
  <script type="module" src="renderer.js"></script>
</body>
</html>
