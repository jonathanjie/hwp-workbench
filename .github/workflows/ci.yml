name: Preservation core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/generate-fixtures.py
      - run: python3 scripts/run-tests.py
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-results-${{ matrix.os }}-${{ matrix.python }}
          path: reports/test-results.json
  # Desktop packaging, signing, and actual Apple Silicon UI smoke tests are
  # explicit release gates, not implied by a successful core job.
