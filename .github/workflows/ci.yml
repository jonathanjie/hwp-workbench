name: Rust and renderer
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - run: cargo fmt --all -- --check
      # The Tauri Cargo build script uses the renderer npm dependency.
      - run: npm ci --no-audit --no-fund
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run build:frontend
      - run: cargo test --workspace --locked -- --include-ignored
      - run: npm run check
      - run: npm run test:desktop
      - run: npm run test:packaging
      - run: node --test tests/qa/*.test.mjs
      - run: npx playwright install webkit
      - run: npm run test:webkit
